mlp:
  hidden_neurons: {type: int, min: 5, max: 500}
  learning_rate: {type: float, min: 1.0e-8, max: 1.0e-2, scale: log10}
  l2_alpha: {type: float, min: 1.0e-8, max: 1.0e-2, scale: log10}
  dropout_rate: {type: float, min: 0.0, max: 0.10}
  batch_size: {type: categorical, values: [16, 32, 64, 80, 112, 128]}

svm:
  C: {type: float, min: 1.0e-3, max: 1.0e3, scale: log10}
  gamma: {type: float, min: 1.0e-5, max: 1.0e1, scale: log10}
  kernel: {type: categorical, values: ['linear', 'rbf']}

rf:
  n_estimators: {type: int, min: 50, max: 500}
  max_depth: {type: int, min: 5, max: 50}
  min_samples_split: {type: int, min: 2, max: 20}
  min_samples_leaf: {type: int, min: 1, max: 20}
  max_features: {type: categorical, values: ['sqrt', 'log2', null]}
  class_weight: {type: categorical, values: [null, 'balanced']}

cnn:
  n_filters: {type: int, min: 8, max: 128}
  kernel_size: {type: int, min: 2, max: 5}
  dense_neurons: {type: int, min: 16, max: 256}
  learning_rate: {type: float, min: 1.0e-8, max: 1.0e-2, scale: log10}
  l2_alpha: {type: float, min: 1.0e-8, max: 1.0e-2, scale: log10}
  dropout_rate: {type: float, min: 0.0, max: 0.10}
  batch_size: {type: categorical, values: [16, 32, 64, 80, 112, 128]}
