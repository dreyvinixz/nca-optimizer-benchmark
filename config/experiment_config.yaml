experiment:
  name: nca_optimizer_benchmark_v1
  target_journal: Neural Computing and Applications
  contribution: controlled optimizer benchmark for neural intraday trend classification

data:
  datetime_column: datetime
  target_column: trend
  label_mapping:
    downtrend: 0
    uptrend: 1
  selected_feature_set: InfoGain_7
  selected_feature_indices: [30, 52, 31, 53, 42, 33, 41]

split:
  protocol: temporal_holdout
  train_size: 0.60
  validation_size: 0.20
  test_size: 0.20
  shuffle: false

model:
  type: mlp
  backend: auto
  allow_numpy_fallback: false
  activation: tanh
  output_activation: sigmoid
  optimizer: rmsprop
  loss: binary_crossentropy
  max_epochs: 10
  early_stopping_patience: 3
  validation_metric: val_loss

objective:
  fitness_mode: mcc_f1
  fitness:
    mcc_weight: 0.60
    f1_weight: 0.40
  threshold: 0.50

benchmark:
  parallel_enabled: true
  n_jobs: -1
  parallel_backend: loky
  tf_intraop_threads: 1
  tf_interop_threads: 1
  experiment_mode: official_run
  
  quick_test:
    seeds: [1]
    generations: 10
    iterations: 10
    evaluations_per_seed: 100
    official_experiment: false
    
  validation_run:
    seeds: [1, 2, 3]
    evaluations_per_seed: 100
    official_experiment: false
    
  official_run:
    seeds: [1, 2, 3]
    evaluations_per_seed: 1000
    generations: 100
    iterations: 100
    official_experiment: true

  ga:
    population_size: 10
    crossover_probability: 0.80
    mutation_probability: 0.20
    mutation_scale: 0.10
    tournament_size: 3
  pso:
    particles: 10
    inertia: 0.70
    cognitive: 1.50
    social: 1.50
  de:
    population_size: 10
    mutation_factor: 0.80
    crossover_rate: 0.90
    strategy: "best/1/bin"
  gwo:
    wolves: 10
